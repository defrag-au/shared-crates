[package]
name = "fal-client"
version.workspace = true
authors.workspace = true
edition = "2021"
description = "fal.ai image/video generation client (Qwen inpaint, Flux Fill, H3 Max video) using http-client for platform-agnostic HTTP"

[dependencies]
http-client = { path = "../http-client" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = "2.0"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
