[package]
name = "ownership-client"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "Typed HTTP client for the collection-ownership service"

[features]
# The HTTP client. On by default, so every existing consumer is unchanged.
#
# Off, this crate is only the service's wire types: serde and nothing else.
# That is what a macroquad game needs (`cnft-holdings`), because reqwest on
# wasm32 is built on wasm-bindgen, which can never run under miniquad.
default = ["client"]
client = ["dep:reqwest"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"], optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

# TLS only needed on native — WASM uses the runtime's fetch API
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
