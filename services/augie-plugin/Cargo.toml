[package]
name = "augie-plugin"
version.workspace = true
authors.workspace = true
edition = "2021"
description = "Wire protocol for services that advertise Discord commands to the Augie bot host"

[dependencies]
serde = { workspace = true, features = ["derive"] }
# A tool's parameter schema and an invocation's arguments are genuinely
# free-form JSON — they are whatever the tool declares. Everything else on this
# wire stays typed.
serde_json = { workspace = true }
# The message model. Lives outside this crate because the outbound client needs
# it too, and a Discord client depending on the *plugin protocol* is backwards.
discord-message = { workspace = true }
# A plugin describes a graphic it wants; the HOST renders it. See
# `CommandResponse::render` for why the plugin cannot do this itself.
render-protocol = { path = "../render-protocol" }
# Typed tool parameters, and the single generator of their JSON Schema.
tool-schema = { path = "../tool-schema" }
