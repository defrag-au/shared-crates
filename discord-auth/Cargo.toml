[package]
name = "discord-auth"
version = "0.1.0"
edition.workspace = true
description = "Reusable Discord-OAuth role gating: config-driven guild-role → entitlement resolution, a worker callback mixin, and a frontend session helper for wasm-bindgen and miniquad apps"
license = "MIT"

[features]
default = []
# Server-side OAuth login and callback handlers (Cloudflare Workers).
worker = ["dep:worker_stack", "dep:authorizations", "dep:chrono", "dep:getrandom"]
# Frontend session loading + login redirect, through web-sys (wasm-bindgen apps).
web = ["dep:web-sys", "dep:wasm-bindgen", "dep:js-sys", "dep:authorizations"]
# The same, through a miniquad plugin (`js/discord-auth.js`): for macroquad
# games, whose runtime cannot host wasm-bindgen. Pulls nothing that does.
miniquad = ["dep:sapp-jsutils"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
toml = { version = "0.8", default-features = false, features = ["parse"] }

# Only the `worker` and `web` edges need these. `authorizations` brings chrono's
# `wasmbind` (and so wasm-bindgen), which the core and the `miniquad` edge must
# not pull.
authorizations = { workspace = true, optional = true }
worker_stack = { workspace = true, optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock"], optional = true }
# The login `state` nonce, from the worker's Web Crypto.
getrandom = { workspace = true, optional = true }

web-sys = { workspace = true, optional = true, features = [
    "Window", "Location", "History", "Storage",
] }
wasm-bindgen = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
sapp-jsutils = { version = "0.1", optional = true }
