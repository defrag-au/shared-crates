[package]
name = "hex-wfc"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Socket-based Wave Function Collapse for even-r hex grids: TOML tile sets with rotational expansion, backtracking solver, and chunk-edge constraints. Terrain is the caller's type."

[dependencies]
rand = { version = "0.9", default-features = false, features = ["small_rng", "alloc"] }
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
toml = "0.8"
