# Copied from augminted-bots `services/microversus-wfc/resources/ocean_islands.toml`
# (Uncharted Cove, v1): the tile set these tests were written against.
#
# Uncharted Cove — Ocean & Islands tile set (v1)
#
# Socket key:
#   d = deep ocean        w = sea (shallow)
#   c = shoreline water-side  C = shoreline land-side
#   s = sand/beach        l = land interior
#   r = reef
#
# Sockets are 6 chars, clockwise from NE: NE E SE SW W NW
# rotate = true auto-generates all 6 rotational variants

[chunk]
layout = "even-r"
size = 96

[sockets]
pairs = [
    "d-d", "d-w",
    "w-w", "w-c", "w-r",
    "c-C",
    "C-s", "C-l",
    "s-s", "s-l",
    "l-l",
    "r-r", "r-w",
]

# --- Ocean ---

[[tiles]]
id = "deep_ocean"
terrain = "deep_ocean"
sockets = "dddddd"
weight = 50

[[tiles]]
id = "open_water"
terrain = "sea"
sockets = "wwwwww"
weight = 30

[[tiles]]
id = "deep_to_shallow"
terrain = "sea"
sockets = "dddwww"
weight = 10
rotate = true

# --- Coastline patterns (auto-rotated) ---

# Narrow point — tiny islet tip (5 water, 1 land)
[[tiles]]
id = "coast_point"
terrain = "shoreline"
sockets = "cwwwwC"
weight = 2
rotate = true

# Peninsula — (4 water, 2 land)
[[tiles]]
id = "coast_peninsula"
terrain = "shoreline"
sockets = "cwwwCl"
weight = 4
rotate = true

# Bay — sheltered cove (3 water, 3 land) — good for ports
[[tiles]]
id = "coast_bay"
terrain = "shoreline"
sockets = "cwwCll"
weight = 10
rotate = true

# Headland — two adjacent coast edges (2 water, 4 land)
[[tiles]]
id = "coast_headland"
terrain = "shoreline"
sockets = "ccCCll"
weight = 8
rotate = true

# Inlet — mostly land (1 water, 5 land)
[[tiles]]
id = "coast_inlet"
terrain = "shoreline"
sockets = "cwClll"
weight = 5
rotate = true

# --- Land interiors ---

[[tiles]]
id = "lowland"
terrain = "lowland"
sockets = "llllll"
weight = 15

[[tiles]]
id = "hills"
terrain = "hills"
sockets = "llllll"
weight = 8

[[tiles]]
id = "mountain"
terrain = "mountain"
sockets = "llllll"
weight = 3

# --- Hazards ---

[[tiles]]
id = "reef"
terrain = "reef"
sockets = "rwwwwr"
weight = 2
rotate = true
