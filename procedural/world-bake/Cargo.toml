[package]
name = "world-bake"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Reading a baked world: octahedral 16-bit layers with a typed manifest (elevation with an explicit sea level, climate, cloud, detail elevation), sampled by direction. Pure: the generator and baker live elsewhere."

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
# Layers are 16-bit greyscale PNGs.
image = { workspace = true, features = ["png"] }

[dev-dependencies]
tempfile = "3"
