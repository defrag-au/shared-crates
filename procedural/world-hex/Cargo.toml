[package]
name = "world-hex"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Hex navigation on a world sphere: H3 cells for any planet direction, deterministic neighbours, A* over cells, flat regional patches, and frame rotation to keep H3's twelve pentagons off land."

[dependencies]
# Researched 2026-11-18: pure Rust, no wasm-bindgen on wasm32 (the only
# getrandom is inside ahash's compile-time proc-macro, run on the host).
h3o = "0.11.1"
# Grid-agnostic A*; the same crate microversus-world uses for flat hexes.
pathfinding = "4.16"
