[package]
name = "tectonics"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "A planet's crust through geological time: rigid plates drifting over the sphere, new sea floor at the ridges between them, subduction raising cordilleras and island arcs, continents colliding and rifting, hotspot island chains, continental shelves. After Cortial et al., Procedural Tectonic Planets (Eurographics 2019). Pure and deterministic from a seed."

# Pure: no I/O, no threads, no GPU, so a bake, a viewer and a web build can
# all run it.
[dependencies]
glam = "0.29"

[dev-dependencies]
anyhow = "1"
# The drift example writes its frames as PNG sheets for a globe viewer.
image = { workspace = true, features = ["png"] }
