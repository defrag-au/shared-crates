[package]
name = "world-cartography"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Drawing a world bake as a map: one module per feature (terrain, coast, sea, waves, shore, craters, rivers, trees, clouds), the cel and atlas styles that compose them, and the Style that tunes them. Reads a bake only; the generator and baker live elsewhere."

# Reading a bake only: the generator is not needed to draw one. No I/O
# beyond the image types, no wasm-bindgen: a game can draw its own maps.
[dependencies]
world-bake = { path = "../world-bake" }
glam = "0.29"
image = { workspace = true, features = ["png"] }
rayon = "1.10"
