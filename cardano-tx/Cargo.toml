[package]
name = "cardano-tx"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cardano transaction utilities: fee calculation, min UTxO, and DEX order building"

# WHY THESE EXIST: transaction BUILDING is pure arithmetic over protocol
# parameters, but two vendor adapters were wired in unconditionally and dragged
# the whole HTTP stack in behind them:
#
#   cardano-tx → http-client → worker_stack → worker → wasm-bindgen
#   cardano-tx → maestro     → http-client  → (as above)
#
# Measured 2026-09-18: 46 wasm-bindgen crates reached a macroquad frontend that
# wanted nothing but `TxBuildParams`. wasm-bindgen can NEVER link under
# miniquad, so those two edges foreclosed client-side transaction building for
# every macroquad host — for two `From` impls and one `TxEvaluator`.
#
# Both default ON so every existing consumer compiles unchanged. A host that
# only builds transactions takes `default-features = false` and gets a crate
# with no HTTP in it at all.
[features]
default = ["maestro", "http"]
# Adapters for the Maestro indexer: `From<&maestro::ProtocolParameters>` and
# `impl TxEvaluator for MaestroApi`. The Maestro Developer API shuts down
# 2026-09-18; this feature is the seam along which it gets deleted, and turning
# it off is how cargo enumerates what still depends on it.
maestro = ["dep:maestro"]
# Outbound HTTP — currently only the Splash DEX analytics endpoints, which are
# the sole reason this crate ever needed a network stack.
http = ["dep:http-client"]

[dependencies]
# Cardano primitives
pallas-addresses = { workspace = true }
pallas-codec = { workspace = true }
pallas-crypto = { workspace = true }
pallas-primitives = { workspace = true }
pallas-txbuilder = { workspace = true }

# Workspace crates
cardano-assets = { workspace = true }
address-registry = { workspace = true }
# BOTH OPTIONAL, and that is load-bearing — see `[features]` below.
maestro = { path = "../indexers/maestro", optional = true }
http-client = { path = "../http-client", optional = true }

# Workspace crates (serde helpers)
wasm_safe_serde = { path = "../wasm-safe-serde" }

# General
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
hex = "0.4"
thiserror = { workspace = true }
tracing = { workspace = true }
# Object-safe async trait (`dyn SubmitProvider`) so an ordered fallback list can
# hold heterogeneous providers (mitos + maestro). `?Send` form is wasm-safe.
async-trait = "0.1"

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
# Decodes built transactions so tests can assert on what was actually
# serialised, rather than on the builder's own intermediate state.
pallas-traverse = { workspace = true }
# Tests only. The CIP-68 `extra` parameter exists for the action protocol's
# fuel tank, so one test drives a REAL `FuelBody` through it end to end —
# the alternative is a hand-rolled map that agrees with nothing.
action-definitions = { path = "../action-definitions" }
