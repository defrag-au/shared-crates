[workspace]
members = [
    "action-definitions",
    "action-definitions-derive",
    "address-registry",
    "anvil-api",
    "asset-intents",
    "asset-metadata-index",
    "authorizations",
    "image-hash",
    "magic-link",
    "email-service",
    "discord-auth",
    "cardano-tx",
    "cardano-assets",
    "cnft-holdings",
    "mint-manifest",
    "ocfl",
    "cnft-tools",
    "discord-message",
    "discord-outbound",
    "fal-client",
    "filebase",
    "handle-cache",
    "handle-resolver",
    "local-cache",
    "http-client",
    "openai-client",
    "perf-probe",
    "pinata",
    "test-utils",
    "tx-insights",
    "tx-verdict",
    "wasm-safe-serde",
    "worker-stack",
    "worker-utils",
    "asset-rarity",
    # Games: replay verification, lockstep rooms, and the macroquad game
    # layer. Kept together so the game crates read as one family.
    "gaming/*",
    "chains",
    "chain-ledger",
    "chain-ledger-koios",
    "chain-ledger-case",
    "chain/*",
    "services/*",
    "indexers/*",
    "evm/*",
    "ui/scss-macros",
    "ui/ui-core",
    "ui/ui-theme",
    "ui/ui-flow",
    "ui/chain-live",
    "ui/ui-flow-protocol",
    "ui/ui-flow-server",
    "ui/ui-loader",
    "ui/ui-loader-macros",
    "ui/ui-toast",
    "ui/ui-components",
    "ui/discord-miniquad",
    "ui/wallet-core",
    "ui/wallet-pallas",
    "ui/wallet-leptos",
    "ui/wallet-miniquad",
    "ui/macroquad-tui",
    "ui/macroquad-wallet-flow",
    "ui/macroquad-cnft",
    "ui/macroquad-text",
    "ui/macroquad-widgets",
    "ui/macroquad-bundle",
    "ui/macroquad-storybook",
    "ui/miniquad-platform",
    "ui/canvas-bridge",
    "ui/image-core",
    "ui/mq-flow-probe",
    "ui/egui-widgets",
    "ui/portal-pane",
    "ui/_storybook",
    "ui/_storybook-egui",
    "ui/workers/flow-demo",
    "ui/workers/flow-demo/frontend",
    "procedural/*",
    "ai-media-gen",
    "pipeline/*",
    "compositor/*",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
# Inherited by the macroquad kit (gamekit, widgets, text) so a consumer on an
# older rustc gets cargo's clear "requires rustc 1.88" rather than an error deep
# in a dependency: let-chains and `as_chunks` are 1.88, fontdue 0.9 needs 1.87.
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/defrag-au/shared-crates"
authors = ["Damon Oehlman <damon@defrag.au>"]

[workspace.dependencies]
async-stream = "0.3.6"
futures-core = "0.3.31"
futures-util = "0.3.31"
axum = { version = "0.8", default-features = false, features = ["json", "macros"] }
tower-http = { version = "0.6" }
gloo-net = "0.6.0"
indexmap = { version = "2.0", features = ["serde"] }
phf = { version = "0.11", features = ["macros"] }
reqwest = { version = "0.12.12", default-features = false }
# JSON Schema derived from the type that parses the arguments, so a tool's
# declaration and its reader are the same definition. Already in the tree
# transitively; taking it directly adds nothing to the build.
schemars = { version = "1" }
serde = { version = "1.0.217" }
serde_json = { version = "1.0.134" }
serde_with = { version = "3.12.0" }
tokio = { version = "1.43.0", default-features = false }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3" }
utoipa = { version = "5" }

# worker and wasm-bindgen associated resources
# Note: These are now managed through the worker_stack facade crate
# with pinned versions to ensure ecosystem compatibility
worker_stack = { path = "worker-stack" }

# UI workspace dependencies (from shared-ui)
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlImageElement",
    "Node",
    "NodeList",
    "Text",
    "ShadowRoot",
    "ShadowRootInit",
    "ShadowRootMode",
    "CustomElementRegistry",
    "Event",
    "EventTarget",
    "MouseEvent",
    "InputEvent",
    "HtmlInputElement",
    "Storage",
    "console",
    "DomTokenList",
    "CssStyleDeclaration",
    "CustomEvent",
    "CustomEventInit",
    "FocusEvent",
    "KeyboardEvent",
] }
# Cardano primitives
hex = "0.4"
pallas-addresses = "1.4.0"
pallas-codec = "1.4.0"
pallas-crypto = "1.4.0"
pallas-primitives = "1.4.0"
pallas-traverse = "1.4.0"
pallas-txbuilder = "1.4.0"
pallas-utxorpc = "1.4.0"
utxorpc-spec = "0.19"

thiserror = "1"
futures = "0.3"
futures-signals = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
maud = "0.26"
rmp-serde = "1.3"
serde-wasm-bindgen = "0.6"
serde_repr = "0.1"
getrandom = { version = "0.3", features = ["wasm_js"] }
rand = { version = "0.9", features = ["small_rng", "std"] }
log = "0.4"
# Hierarchical state machines (statig) — plain sync `handle(&event)`, no_std,
# no deps beyond its own macro crate, so it is safe under wasm-bindgen AND
# macroquad. Already the FSM in augminted-native-bots and blockchain-infra;
# here it drives UI state that used to be flag soup (the time spine's tape).
statig = "0.4.1"

# egui stack
egui = "0.36"
egui_inbox = "0.13"
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow"] }
egui_extras = { version = "0.36", features = ["image", "http"] }
image = { version = "0.25", default-features = false }
# Glyph outlines + metrics for CPU text composition (`compositor/meme-layout`,
# `ui/egui-widgets`'s image editor). Pure Rust, no system font stack, so it
# works identically in a worker and in wasm.
ab_glyph = { version = "0.2" }

# Internal path deps usable as workspace deps
address-registry = { path = "address-registry" }
asset-intents = { path = "asset-intents" }
authorizations = { path = "authorizations" }
cardano-assets = { path = "cardano-assets" }
# What a player holds of a CNFT collection, as a game sees it. Pure: the
# macroquad edge is `ui/macroquad-cnft`.
cnft-holdings = { path = "cnft-holdings" }
# Chain identity — which chain, and which network on it, as a CAIP-2 string on
# the wire. Pure serde, no runtime, so a widget, a worker and a macroquad game
# can all name a chain without any of them dragging the others in.
chains = { path = "chains" }
image-hash = { path = "image-hash" }
# Sign a waiting device in by approving it elsewhere (emailed link or pairing
# code). Pure; the caller stores grants and supplies randomness.
magic-link = { path = "magic-link" }
# Sending email from a Worker (Resend). Moved from cnft.dev-workers'
# services/email, which had no consumers left.
email-service = { path = "email-service" }
discord-auth = { path = "discord-auth" }
# The serde-only Discord message model, and the client that sends it. Split
# because the model is consumed by things that never send (the plugin protocol)
# and the client drags an HTTP stack.
discord-message = { path = "discord-message" }
discord-outbound = { path = "discord-outbound" }
cardano-tx = { path = "cardano-tx" }
worker_utils = { path = "worker-utils" }
asset-rarity = { path = "asset-rarity" }
# Frame-cost + in-flight-work counters. Pure std, no runtime — so `browser-fetch`
# can increment a gauge without taking a dependency on any UI framework, and the
# egui and macroquad sides can both read the same numbers.
perf-probe = { path = "perf-probe" }
egui-widgets = { path = "ui/egui-widgets" }
# Renderer-free design tokens + colour science. Consumers pick the `Paint` impl
# they need: `features = ["egui"]` or `features = ["macroquad"]`.
ui-theme = { path = "ui/ui-theme" }
portal-pane = { path = "ui/portal-pane" }
gateway-wiring = { path = "services/gateway-wiring" }
gateway-admin-protocol = { path = "services/gateway-admin-protocol" }
wallet-core = { path = "ui/wallet-core" }
wallet-pallas = { path = "ui/wallet-pallas" }
# Games, all under gaming/. Replay-verified games (ported from the adacade
# workspace): `arcade-core` is a pure serde primitive.
arcade-core = { path = "gaming/arcade-core" }
# Lockstep rooms: the pure room and client state machines, the sim trait a
# game implements, and the wire format. No dependencies, so the same crate runs
# in a Durable Object, a macroquad client and a native load test.
arcade-room = { path = "gaming/arcade-room" }
# The Durable Object that hosts an arcade-room world, for a game's worker to
# compose. Not deployed from here.
arcade-room-worker = { path = "gaming/arcade-room-worker" }
# A room client's connection for macroquad games: the client over quad-net,
# with quad-net's traps handled once.
arcade-room-quad = { path = "gaming/arcade-room-quad" }
arcade-harness = { path = "gaming/arcade-harness" }
macroquad-wallet-flow = { path = "ui/macroquad-wallet-flow" }
macroquad-cnft = { path = "ui/macroquad-cnft" }
macroquad-widgets = { path = "ui/macroquad-widgets" }
wallet-miniquad = { path = "ui/wallet-miniquad" }
tx_insights = { path = "tx-insights" }
tx-verdict = { path = "tx-verdict" }
test_utils = { path = "test-utils" }
pipeline-types = { path = "pipeline/pipeline-types" }
transactions = { path = "pipeline/transactions" }
tx-classifier = { path = "pipeline/tx-classifier" }
oura-decoder = { path = "pipeline/oura-decoder" }
datum-parsing = { path = "pipeline/datum-parsing" }
maestro = { path = "indexers/maestro" }
http-client = { path = "http-client" }
wasm_safe_serde = { path = "wasm-safe-serde" }

# macroquad's glyph-atlas packing fix (upstream 8d602d3, "text: avoid spurious
# font atlas growth"), which landed after 0.4.16. A glyph landing within 2 px of
# a row's end doubled the whole atlas, at random: one solada board run in twelve
# reached an 8192² atlas (256 MB). The rev is 0.4.16 plus a docs change plus the
# fix, nothing else. A [patch] only applies in the workspace that builds, so
# every consumer of macroquad-gamekit carries this line too.
# Drop it, here and in each consumer, once a release after 0.4.16 is out.
[patch.crates-io]
macroquad = { git = "https://github.com/not-fl3/macroquad", rev = "8d602d3f8ebb8a3a582ee15d92983bbb81ee3ef6" }
