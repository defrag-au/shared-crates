[package]
name = "mq-apk"
version = "0.1.0"
edition.workspace = true
publish = false
description = "Package a macroquad app as an Android APK — runs this workspace's macroquad-apk"

# A one-line binary over the library, because cargo runs only this workspace's
# own binaries — the same runner shape as `tools/mq-bundle`. Everything it does
# is documented in ui/macroquad-apk/src/lib.rs.
#
#   cargo run -q -p mq-apk -- --package au.defrag.x --library x_mq --crate x-mq \
#       [--manifest <path>] [--icon <png> --banner <png> | --no-art] \
#       [--out <path>] [--dry-run]

[[bin]]
name = "mq-apk"
path = "src/main.rs"

[dependencies]
macroquad-apk = { path = "../../ui/macroquad-apk" }
