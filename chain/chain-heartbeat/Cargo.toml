[package]
name = "chain-heartbeat"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Cardano block-production heartbeat: follow the tip from an always-on host and report honest tempo stats"

[features]
default = ["follow"]
# The chain follower (Ouroboros over a caller-supplied stream). Hosts that
# follow the chain keep this on. Consumers that only render snapshots (egui,
# macroquad, a Nostr client) turn it off and get the pure types and stats.
follow = ["dep:ouroboros-mux", "dep:futures-io", "dep:futures-util"]
# The subscriber-side socket: frames from a heartbeat host's `/heartbeat/flow`,
# folded into a [`Heartbeat`] and fed through a [`Tracker`]. Renderer-free — the
# TRANSPORT is chosen by whichever ui-flow feature the consumer enables
# (`macroquad` under miniquad, the default web-sys transport under egui).
#
# This is here rather than in `chain-live` because the socket is the same one a
# macroquad client opens, and two copies of it is how a dropped connection
# comes to read differently on two surfaces.
flow = ["dep:ui-flow"]

# Everything here is pure Rust with no wasm-bindgen, so the crate is safe for
# miniquad targets as well as wasm-bindgen frontends and Workers.
[dependencies]
blake2 = "0.10"
hex = { workspace = true, features = ["serde"] }
# The tracker warns when a status source fails. Pure, and the only logging in
# the crate.
log = { workspace = true }
minicbor = { version = "0.26", features = ["std"] }
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
wasm_safe_serde = { workspace = true }

ouroboros-mux = { path = "../ouroboros-mux", optional = true }
futures-io = { version = "0.3", optional = true }
futures-util = { workspace = true, optional = true }

# The socket to a heartbeat host, for the `flow` feature. No default features:
# the consumer's ui-flow feature is what picks the transport, and defaulting to
# web-sys here would put wasm-bindgen in a miniquad binary.
ui-flow = { path = "../../ui/ui-flow", default-features = false, optional = true }

[dev-dependencies]
futures = { workspace = true }
serde_json = { workspace = true }
# A watched transaction rides ui-flow, which is MessagePack: the test holds
# its bytes to a byte string on that wire.
rmp-serde = { workspace = true }
