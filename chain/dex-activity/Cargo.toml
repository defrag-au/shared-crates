[package]
name = "dex-activity"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "DEX activity decoded from a Cardano block body, for a live feed"

# Pure: no I/O, no clock, no wasm-bindgen. The gateway feeds it blocks and the
# UI that renders the feed shares its types, so both read the same event.
[dependencies]
address-registry = { workspace = true }
chain-heartbeat = { path = "../chain-heartbeat", default-features = false }
hex = { workspace = true }
minicbor = { version = "0.26", features = ["std"] }
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
tracing = { workspace = true }
wasm_safe_serde = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
