[package]
name = "action-definitions"
version.workspace = true
authors.workspace = true
edition = "2021"
description = "On-chain action definitions: the PlutusData codec, the vocabulary, validate() and recognise()"

# PURE — no I/O, no wasm-bindgen, no worker deps, nothing async. The same
# crate is consumed from a Cloudflare worker (the actions worker), a
# wasm-bindgen frontend (the egui operator surface), a macroquad app (the
# burn app, where wasm-bindgen can never run), a native verifier binary and
# eventually a wasip2 mitos module. `tests/no_forbidden_deps.rs` asserts the
# tree stays that way.
#
# The on-chain codec is NOT serde — see docs/design/ACTION_DEFINITION_SCHEMA.md
# §1. serde rides along on the same types for JSON only.
[dependencies]
action-definitions-derive = { path = "../action-definitions-derive" }
pallas-primitives = { workspace = true }
pallas-codec = { workspace = true }
serde = { workspace = true, features = ["derive"] }
hex = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
