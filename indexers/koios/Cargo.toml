[package]
name = "koios"
version = "0.1.0"
edition.workspace = true

[features]
default = []
# Provide `impl cardano_tx::evaluate::TxEvaluator for KoiosApi` so a tx builder
# can source script ExUnits from Koios's Ogmios `evaluateTransaction`. Off by
# default so pure-indexer consumers don't pull the tx-builder crate.
evaluator = ["dep:cardano-tx", "dep:async-trait"]

[dependencies]
cardano-assets = { workspace = true }
http-client = { workspace = true }
serde = { workspace = true, features = ["derive"] }
wasm_safe_serde = { workspace = true }
serde_json = { workspace = true }
# CIP-25 v1 keys asset names as UTF-8; `KoiosAssetInfo::cip25_record`
# decodes the hex name to try that form too.
hex = "0.4"
serde_with = "3"
worker_stack = { workspace = true }
worker_utils = { workspace = true }
tracing = { workspace = true }
nom = "7"
cardano-tx = { workspace = true, optional = true }
async-trait = { version = "0.1", optional = true }

# The retry pause. Every native consumer already runs a tokio runtime with
# timers enabled (`#[tokio::main]` or `Builder::enable_all`); wasm uses
# `worker::Delay` instead.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "time"] }
test_utils = { workspace = true }
