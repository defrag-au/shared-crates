name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 1
  CARGO_PROFILE_DEV_DEBUG: 0
  # The OCFL community fixtures (`OCFL/ocfl-fixtures`), pinned so that a red
  # build means this repo's `ocfl` crate drifted from the spec — not that
  # upstream moved overnight. Bump deliberately, and rehearse locally the same
  # way `tests/fixtures.rs` documents.
  OCFL_FIXTURES_REV: d323fc207126becec066998b43408d998bf0fb1b

jobs:
  # An edit under `skills/` that was never published is an edit no consumer can see: an OCFL
  # version is immutable, so the published object is still the old one. `skill-store status` fails
  # on that, and on a skill directory with no object. Fix a red run with `skill-store
  # publish-changed --store .skill-store --worktree skills`, committed with the edit.
  skills:
    name: Skills
    uses: defrag-au/agent-playbook/.github/workflows/skills-check.yaml@main

  check-and-test:
    name: Check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "test"
          cache-on-failure: true

      # `storybook-egui` is a cdylib with its own storybook build; it is
      # excluded here so this job does not try to run it.
      - run: cargo check --workspace --exclude storybook-egui --all-targets
      - run: cargo test --workspace --exclude storybook-egui --all-targets
      # The workspace runs default features, which leave out scenegraph's glTF
      # importer: models, rigs, clips and the Khronos fixtures that test them.
      - name: scenegraph with glTF
        run: cargo test -p scenegraph --features gltf

  ocfl-fixtures:
    name: OCFL Fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "test"
          cache-on-failure: true

      # The pinned revision, fetched shallow — GitHub serves fetches by SHA.
      - name: Check out the community fixtures
        run: |
          mkdir -p .tmp
          git init .tmp/ocfl-fixtures
          git -C .tmp/ocfl-fixtures remote add origin https://github.com/OCFL/ocfl-fixtures
          git -C .tmp/ocfl-fixtures fetch --depth 1 origin "${OCFL_FIXTURES_REV}"
          git -C .tmp/ocfl-fixtures checkout --detach FETCH_HEAD

      # 12 good objects must validate, 13 warning objects must not be
      # rejected, 55 bad objects must be rejected; the test's own counts line
      # (kept visible with --nocapture) is the signal. See tests/fixtures.rs.
      - name: Run the fixture suite
        run: OCFL_FIXTURES="${GITHUB_WORKSPACE}/.tmp/ocfl-fixtures" cargo test -p ocfl --test fixtures -- --nocapture

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "clippy"
          cache-on-failure: true

      - run: cargo clippy --workspace --exclude storybook-egui --all-targets -- -D warnings

  wasm-check:
    name: WASM Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "wasm-check"
          cache-on-failure: true

      # The miniquad-linkability guard, named here on purpose.
      #
      # It also runs inside `cargo test --workspace` in the other job, so this
      # is not the only thing executing it — but a reader scanning this file for
      # "what stops wasm-bindgen reaching the macroquad path" should find it,
      # and an `--exclude` added to that job later must not be able to kill it
      # silently. The test itself explains what it checks and why.
      - name: Guard — cardano-tx stays linkable under miniquad
        run: cargo test -p cardano-tx --test miniquad_linkable

      - name: Check wasm-compatible crates
        # flow-demo and flow-demo-frontend are excluded: they're Cloudflare Workers
        # built by wrangler, and depend on getrandom/rand with wasm_js feature
        # which requires JS glue not available in bare wasm32 target
        #
        # The macroquad surfaces now live in `macroquad-kit`, which runs its own
        # wasm check. This job keeps the pure crates: `arcade-core` is pure serde
        # and belongs here.
        run: |
          cargo check --target wasm32-unknown-unknown \
            -p arcade-core \
            -p asset-intents \
            -p cardano-assets \
            -p wasm_safe_serde \
            -p worker_stack \
            -p worker_utils \
            -p scss-macros \
            -p ui-core \
            -p ui-flow \
            -p ui-flow-protocol \
            -p ui-loader \
            -p ui-loader-macros \
            -p ui-toast \
            -p ui-components \
            -p wallet-core \
            -p wallet-pallas \
            -p wallet-leptos \
            -p shared-ui-storybook
          # The scenegraph's macroquad backend. The pure crates (glTF included,
          # as sceneapp enables it) and `scenegraph-mq` are checked here;
          # `scene-pane` and the gamekit moved to `macroquad-kit`.
          # `scenegraph-wgpu` is absent on purpose: no macroquad build links it.
          cargo check --target wasm32-unknown-unknown \
            -p scenegraph --features gltf \
            -p sceneanim \
            -p sceneinput \
            -p scenedrv \
            -p sceneworld \
            -p sceneapp \
            -p scenegraph-mq
