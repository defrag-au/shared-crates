name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 1
  CARGO_PROFILE_DEV_DEBUG: 0
  # The OCFL community fixtures (`OCFL/ocfl-fixtures`), pinned so that a red
  # build means this repo's `ocfl` crate drifted from the spec — not that
  # upstream moved overnight. Bump deliberately, and rehearse locally the same
  # way `tests/fixtures.rs` documents.
  OCFL_FIXTURES_REV: d323fc207126becec066998b43408d998bf0fb1b

jobs:
  # An edit under `skills/` that was never published is an edit no consumer can see: an OCFL
  # version is immutable, so the published object is still the old one. `skill-store status` fails
  # on that, and on a skill directory with no object. Fix a red run with `skill-store
  # publish-changed --store .skill-store --worktree skills`, committed with the edit.
  skills:
    name: Skills
    uses: defrag-au/agent-playbook/.github/workflows/skills-check.yaml@main

  check-and-test:
    name: Check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "test"
          cache-on-failure: true

      # The macroquad storybook's golden suite is its own job (`visual`): it
      # needs a headless GL runtime, and a changed picture should fail under its
      # own name rather than inside the functional suite. Excluded here so this
      # job does not build or run it.
      - run: cargo check --workspace --exclude storybook-egui --exclude macroquad-storybook --all-targets
      - run: cargo test --workspace --exclude storybook-egui --exclude macroquad-storybook --all-targets
      # The workspace runs default features, which leave out scenegraph's glTF
      # importer: models, rigs, clips and the Khronos fixtures that test them.
      - name: scenegraph with glTF
        run: cargo test -p scenegraph --features gltf

  # A capture is a review, and a golden makes it a test. The storybook's
  # `tests/visual.rs` runs every stable story in `admin`, `app-shell`, `atoms`,
  # `gamekit`, `input` and `page`, and checks the Linux PNG, the text report and
  # that no golden outlives its story. It is kept out of `check-and-test` so a
  # picture change is not buried in the functional suite, and so the one
  # platform-specific dependency is explicit.
  #
  # miniquad's headless backend on Linux dlopen()s libEGL and needs a Mesa
  # driver for the surfaceless pbuffer. Without them the storybook panics on
  # `--list`, before it can print the stories: `miniquad: headless rendering
  # needs libEGL: DlOpenError("libEGL.so.1")`. `.stacks/linux-check` installs
  # the same set; keep the two in step.
  visual:
    name: Visual Goldens
    runs-on: ubuntu-latest
    # The suite launches the storybook once per story per check on software
    # rendering; a hang must not hold the run.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "visual"
          cache-on-failure: true

      - name: Install headless GL
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-6 libgl1 libglx-mesa0 libegl1 libgl1-mesa-dri

      # One golden per platform: this checks `linux.png`; `macos.png` is checked
      # locally by the same test. Two threads run the two per-story sweeps
      # together without putting four llvmpipe contexts on four cores.
      - name: Check the Linux goldens
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: cargo test -p macroquad-storybook --test visual -- --test-threads=2

  ocfl-fixtures:
    name: OCFL Fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "test"
          cache-on-failure: true

      # The pinned revision, fetched shallow — GitHub serves fetches by SHA.
      - name: Check out the community fixtures
        run: |
          mkdir -p .tmp
          git init .tmp/ocfl-fixtures
          git -C .tmp/ocfl-fixtures remote add origin https://github.com/OCFL/ocfl-fixtures
          git -C .tmp/ocfl-fixtures fetch --depth 1 origin "${OCFL_FIXTURES_REV}"
          git -C .tmp/ocfl-fixtures checkout --detach FETCH_HEAD

      # 12 good objects must validate, 13 warning objects must not be
      # rejected, 55 bad objects must be rejected; the test's own counts line
      # (kept visible with --nocapture) is the signal. See tests/fixtures.rs.
      - name: Run the fixture suite
        run: OCFL_FIXTURES="${GITHUB_WORKSPACE}/.tmp/ocfl-fixtures" cargo test -p ocfl --test fixtures -- --nocapture

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "clippy"
          cache-on-failure: true

      - run: cargo clippy --workspace --exclude storybook-egui --all-targets -- -D warnings

  wasm-check:
    name: WASM Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "wasm-check"
          cache-on-failure: true

      # The miniquad-linkability guard, named here on purpose.
      #
      # It also runs inside `cargo test --workspace` in the other job, so this
      # is not the only thing executing it — but a reader scanning this file for
      # "what stops wasm-bindgen reaching the macroquad path" should find it,
      # and an `--exclude` added to that job later must not be able to kill it
      # silently. The test itself explains what it checks and why.
      - name: Guard — cardano-tx stays linkable under miniquad
        run: cargo test -p cardano-tx --test miniquad_linkable

      - name: Check wasm-compatible crates
        # flow-demo and flow-demo-frontend are excluded: they're Cloudflare Workers
        # built by wrangler, and depend on getrandom/rand with wasm_js feature
        # which requires JS glue not available in bare wasm32 target
        #
        # arcade-harness and macroquad-wallet-flow are absent on purpose: they
        # need the miniquad JS plugins to LINK, so they are checked by the
        # consuming repo's wasm job rather than here. arcade-core is pure serde
        # and belongs here.
        #
        # macroquad-widgets IS here, because that reason does not apply to it:
        # `cargo check` does not link, and the crate is a library, so nothing
        # reaches the miniquad plugin step. What this does catch is a dependency
        # that cannot build for wasm32 at all — at the crate that introduced it,
        # rather than in the consuming repo a rev later. `--all-features` so the
        # `chain` feature (and `chain-heartbeat` behind it) is covered too.
        #
        # macroquad-gamekit with `--all-features` for the same reason, and one
        # more: its `audio` and `gamepads` features are off by default (natively
        # on Linux they need ALSA and libudev, which this runner lacks), so no
        # other job compiles them. On wasm32 both go through miniquad plugins and
        # need no system library — this is where they are kept building.
        run: |
          cargo check --target wasm32-unknown-unknown \
            -p macroquad-widgets --all-features
          cargo check --target wasm32-unknown-unknown \
            -p macroquad-gamekit --all-features
          cargo check --target wasm32-unknown-unknown \
            -p arcade-core \
            -p asset-intents \
            -p cardano-assets \
            -p wasm_safe_serde \
            -p worker_stack \
            -p worker_utils \
            -p scss-macros \
            -p ui-core \
            -p ui-flow \
            -p ui-flow-protocol \
            -p ui-loader \
            -p ui-loader-macros \
            -p ui-toast \
            -p ui-components \
            -p wallet-core \
            -p wallet-pallas \
            -p wallet-leptos \
            -p shared-ui-storybook
          # The scenegraph's macroquad path: the pure crates (glTF included,
          # as sceneapp enables it), the macroquad backend and the gamekit
          # pane. scenegraph-wgpu is absent on purpose: no macroquad build
          # links it.
          cargo check --target wasm32-unknown-unknown \
            -p scenegraph --features gltf \
            -p sceneanim \
            -p sceneinput \
            -p scenedrv \
            -p sceneworld \
            -p sceneapp \
            -p scenegraph-mq \
            -p scene-pane
