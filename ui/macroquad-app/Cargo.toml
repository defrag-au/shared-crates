[package]
name = "macroquad-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "The app shell for a macroquad app that is not a game: routes in the page's hash and the back button, safe-area insets, a real text field with the phone's own keyboard, HTTP with any method, an app bar, bottom navigation, toasts and a virtualised art grid. JS plugin on the web, plain Rust natively; no wasm-bindgen."
publish = false

# Why this is its own crate, and not more of `macroquad-widgets`: that crate's
# charter forbids exactly what an app needs (text entry, long clipped lists,
# routing), so that its widgets stay stateless and small. The machinery lives
# here instead, behind its own charter (src/lib.rs). Every dependency below is
# already in the workspace lock; this crate adds none.

[dependencies]
# Direct, not a workspace dep — matches the sibling macroquad crates.
macroquad = "0.4"
# The frame loop (`Frame`, `Stage::Fluid`), `with_clip`, `Ease` and `Animated`.
macroquad-gamekit = { path = "../../gaming/macroquad-gamekit" }
# `Painter`, `Theme`, `Scroll`, the rounded shapes and the sheet chrome.
macroquad-widgets = { workspace = true }
# `Breakpoint`, `TextSize`, `Token`.
ui-theme = { workspace = true, features = ["macroquad"] }
# A request's JSON body and a reply decoded into the caller's type.
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

# Plugin bridge — JsObject transport between Rust and js/app.js.
[target.'cfg(target_arch = "wasm32")'.dependencies]
sapp-jsutils = "0.1"

# Native HTTP, as macroquad-cnft does it: already in the tree at this major
# version and default features, so it adds no crates.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = "2"

[[example]]
name = "shell"
path = "examples/shell.rs"
