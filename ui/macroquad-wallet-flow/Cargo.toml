[package]
name = "macroquad-wallet-flow"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Host-owned wallet connect flows for macroquad apps: CIP-30 (Cardano) and EIP-6963/EIP-1193 (EVM) over wallet-miniquad's request→poll bridge, for macroquad-widgets' WalletConnectVm and macroquad-gamekit's WalletModal, so every macroquad surface connects a wallet identically."

[dependencies]
macroquad = "0.4"
macroquad-widgets = { workspace = true }
# `WalletModal`'s vocabulary, for `modal::CardanoModalHost`: the flow projected
# into the one-button connector. The kit depends on the widgets only, so there
# is no cycle, and it carries no wasm-bindgen.
macroquad-gamekit = { path = "../../gaming/macroquad-gamekit" }
wallet-miniquad = { workspace = true }
# EIP-155 chain names for the EVM account's network line, from the one place
# they are verified rather than from memory. Pure (serde only).
chains = { workspace = true }
# Only for the remembered provider: `platform_storage_*` is the miniquad
# runtime's `localStorage` surface. Native builds stub it out.
miniquad-platform = { path = "../miniquad-platform" }
