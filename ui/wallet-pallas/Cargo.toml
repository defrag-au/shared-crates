[package]
name = "wallet-pallas"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cardano-aware wallet utilities using pallas for serialization and verification"

[features]
default = []
# Enable WASM support for browser usage
wasm = ["dep:wasm-bindgen", "dep:js-sys"]

[dependencies]
# NOTE: `wallet-core` is deliberately NOT a dependency.
#
# It was declared here but never used — `wallet_core` appears in this crate only
# in two doc comments, and nothing in `src/` references it. It is not free to
# carry: wallet-core depends unconditionally on wasm-bindgen, which can never
# run under miniquad's runtime, so its presence alone made this crate unusable
# from a macroquad frontend and from `tx-cart-core`. Dropping it leaves pure
# pallas + cardano-assets + serde + hex, which every runtime can link.

# Cardano asset utilities
cardano-assets = { workspace = true }

# Pallas Cardano primitives
pallas-addresses = { workspace = true }
pallas-codec = { workspace = true }
pallas-primitives = { workspace = true }
pallas-crypto = { workspace = true }

# Serialization
serde = { workspace = true, features = ["derive"] }
hex = "0.4"

# Error handling
thiserror = { workspace = true }

# WASM (optional)
wasm-bindgen = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
