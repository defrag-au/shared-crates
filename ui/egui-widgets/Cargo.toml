[package]
name = "egui-widgets"
version.workspace = true
edition.workspace = true

[features]
default = ["cardano"]
image-editor = ["dep:ab_glyph"]
cardano = [
    "dep:cardano-assets",
    "dep:wallet-core",
    "dep:wallet-pallas",
    "dep:address-registry",
]
# The shared binding editor over gateway-wiring's vocabulary. A feature so
# consumers that only want a widget or two (the portal builds with
# default-features = false) opt into the gateway coupling explicitly.
gateway = ["dep:gateway-wiring"]
# The `puffin` → `flame_chart::Span` adapter, and ONLY that. The widget itself
# is always built: it takes plain spans and has no idea what produced them,
# which is what keeps a profiler out of the graph of everyone who merely draws
# a rectangle.
puffin = ["dep:puffin"]
# `VerdictCard` — the one mapping from a `tx_verdict::TxVerdict` to `TxCard`'s
# domain-free input. Feature-gated for the same reason as `gateway`: the
# catalogue stays domain-free for consumers that never see a verdict.
verdict = ["dep:tx-verdict"]
# `BlockPulse`, `BlockTrain`, `ChainTempo` — live Cardano chain tempo read off a
# `chain_heartbeat::Heartbeat`. Gated for the same reason as `gateway`: most
# consumers never follow a chain, and the catalogue stays chain-free for them.
chain = ["dep:chain-heartbeat"]

# egui_inbox is only used by the wasm `file_upload` widget + a re-export, so it
# moved to the wasm-only deps below (native consumers don't pull it).
[dependencies]
authorizations = { workspace = true }
# IIIF URL + warm-size policy, shared with the macroquad side. Pure crate, no
# runtime — see its docs for why the sizes must live in exactly one place.
image-core = { path = "../image-core" }
# The design vocabulary, renderer-free: `Srgb`, the colour science, and the
# `ColorTokens` / `Token` / `Ink` / `SeriesPalette` model this crate used to own
# outright. Shared with `macroquad-widgets` so the two palettes cannot drift
# apart again — they had already diverged on three colours and on `success`.
# NOT feature-gated: colour is not an optional axis.
ui-theme = { workspace = true, features = ["egui"] }
egui = { workspace = true }
egui_extras = { workspace = true }
# Frame-cost and in-flight-work counters — see `perf_strip`. Pure std, so this
# adds nothing to the build and keeps the probes usable from the macroquad side.
perf-probe = { workspace = true }
# Scope markers for the heavy widgets. NOT a profiler and not a cost: with no
# backend feature enabled anywhere in the graph these macros expand to nothing
# — not a disabled branch, no code at all — so they stay in the shipping build
# and light up the moment a consumer turns one on. Same crate egui and eframe
# are instrumented with, so our scopes appear beside theirs and a slow frame
# can be attributed to our UI code or to the renderer.
profiling = { version = "1.0", default-features = false }
# Read only — this crate never STARTS a profiler, it renders one's output.
# `web` swaps in `web_time::Instant`, without which puffin panics on
# wasm32-unknown-unknown the moment it touches a clock.
puffin = { version = "0.19", optional = true, features = ["web", "packing"] }
ehttp = "0.7"
image = { workspace = true, features = ["jpeg"] }
cardano-assets = { workspace = true, optional = true }
# The marketplace fee formulas — see `listing_composer`, which prices a
# listing by what the buyer pays and needs the contract's exact arithmetic.
address-registry = { path = "../../address-registry", optional = true }
# The gateway trigger-wiring vocabulary AND its rules — see `wiring_editor`.
gateway-wiring = { path = "../../services/gateway-wiring", optional = true }
# The transaction verdict shape — see `verdict_card`.
tx-verdict = { workspace = true, optional = true }
# The chain heartbeat these widgets render — see `block_pulse`. Follower off:
# a renderer only folds frames, it never opens a socket.
chain-heartbeat = { path = "../../chain/chain-heartbeat", default-features = false, optional = true }
serde = { workspace = true, features = ["derive"] }
# `stake_session` persists a session as JSON in localStorage.
serde_json = { workspace = true }
log = { workspace = true }
# Hierarchical FSM for widget interaction state — see `time_spine::tape`.
statig = { workspace = true }
i_overlay = "4.4.1"
voronoice = "0.2"
ab_glyph = { version = "0.2", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# `discord_session` wraps `discord_auth::web::Session` as an `AuthStrategy`.
# wasm-only because that type is localStorage + URL-fragment machinery; the
# crate takes no dependency on it off-target, and `discord-auth` takes none on
# this crate, so there is no cycle.
discord-auth = { workspace = true, features = ["web"] }
egui_inbox = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true, features = [
    "Request", "RequestInit", "Response", "Headers", "Window",
    # `performance.now()` — the only sub-millisecond monotonic clock available
    # here; `Date::now()` is 1 ms-granular, which cannot resolve a 0.9 ms frame.
    "Performance",
    # `wallet.rs` reads `window.location.hostname`. Undeclared until now, so the
    # crate only built for wasm when a CONSUMER happened to enable the feature
    # and cargo unioned it in — `cargo clippy -p egui-widgets --target wasm32`
    # on its own failed.
    "Location",
    # `image_loader::fetch::BrowserHttpLoader` fetches with an abort signal,
    # so a thumbnail nobody can see any more stops downloading.
    "AbortController", "AbortSignal",
    "Blob", "BlobPropertyBag",
    "HtmlImageElement",
    "ImageBitmap",
    # `createImageBitmap(blob, { resizeWidth, resizeHeight })` — the decoder
    # resizes WHILE decoding rather than after, so a grid card never
    # materialises the full artwork at all. Without these the hint is
    # unusable and every image decodes at its source resolution, which is how
    # a page of 84px thumbnails came to hold gigabytes of texture.
    "ImageBitmapOptions", "ResizeQuality",
    "OffscreenCanvas", "OffscreenCanvasRenderingContext2d",
    "ImageData",
    "WorkerGlobalScope",
    "Document", "Element", "HtmlElement", "HtmlInputElement",
    # `html_stage` mounts an on-chain art piece in an iframe. `HtmlIFrameElement`
    # is the element; `CssStyleDeclaration` (implied by `HtmlElement`, which
    # `file_upload` already uses) is how the stage is positioned and stacked.
    "HtmlIFrameElement",
    "FileList", "File", "FileReader",
    # `stake_session` persists a worker session in localStorage.
    "Storage",
    # `auth_worker` drops the `?token=` from the URL after an OAuth callback,
    # via `history.replaceState` — assigning `location.search` instead would
    # reload the page and kill the wasm app mid-frame.
    "History",
] }
js-sys = { workspace = true }
wallet-core = { workspace = true, optional = true }
wallet-pallas = { workspace = true, optional = true }
