<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>egui Widgets Storybook</title>
        <link
            data-trunk
            rel="rust"
            data-wasm-opt="z"
            data-wasm-opt-params="--enable-bulk-memory --enable-nontrapping-float-to-int"
        />
        <link data-trunk rel="copy-dir" href="assets" />
        <style>
            html,
            body {
                margin: 0;
                padding: 0;
                overflow: hidden;
                background: #1a1a2e;
                width: 100%;
                height: 100%;
            }
            canvas {
                width: 100% !important;
                height: 100% !important;
            }
        </style>
    </head>
    <body>
        <canvas id="egui_canvas"></canvas>
        <script>
            // `?fakeevm=1` installs one stub EIP-6963 wallet before the wasm
            // boots, so the EVM half of the wallet work can be seen and tested
            // in a browser that has no EVM extension installed at all —
            // including headless, where nothing ever announces. It answers the
            // protocol the real ones do and nothing else: no chain id, no
            // signature, and an account that is the same synthetic fixture the
            // Rust-side stories use.
            //
            // It is off unless the parameter asks for it, and it announces
            // itself as `Stub EVM wallet` so it can never be mistaken for an
            // installed one.
            if (location.search.includes('fakeevm=1')) {
                const STUB_ACCOUNT = '0x' + '1f'.repeat(20);
                window.addEventListener('eip6963:requestProvider', () => {
                    window.dispatchEvent(
                        new CustomEvent('eip6963:announceProvider', {
                            detail: {
                                info: {
                                    uuid: 'stub-evm-wallet',
                                    name: 'Stub EVM wallet',
                                    icon: null,
                                    rdns: 'dev.stub.evm',
                                },
                                provider: {
                                    request: async ({ method }) =>
                                        method === 'eth_requestAccounts' ||
                                        method === 'eth_accounts'
                                            ? [STUB_ACCOUNT]
                                            : null,
                                },
                            },
                        }),
                    );
                });
            }
        </script>
    </body>
</html>
