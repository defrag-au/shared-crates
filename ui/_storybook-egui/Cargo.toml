[package]
name = "storybook-egui"
version = "0.1.0"
edition.workspace = true
publish = false
# DEV ONLY — egui widgets storybook
# Run with: cd ui/_storybook-egui && trunk serve

[lib]
crate-type = ["cdylib"]

[dependencies]
eframe = { workspace = true }
egui = { workspace = true }
egui_extras = { workspace = true }
authorizations = { path = "../../authorizations" }
egui-widgets = { path = "../egui-widgets", features = ["image-editor", "gateway", "chain"] }
# The chain stories simulate a feed and fold it into a real `Heartbeat`.
chain-heartbeat = { path = "../../chain/chain-heartbeat", default-features = false }
# The vocabulary the wiring-editor story builds its fixtures from.
gateway-wiring = { path = "../../services/gateway-wiring" }
image-core = { path = "../image-core" }
# The perf_strip story drives a real gauge rather than a fixture.
perf-probe = { path = "../../perf-probe" }
cardano-assets = { workspace = true }
cardano-tx = { path = "../../cardano-tx" }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true, features = [
    "Window",
    "Document",
    "HtmlCanvasElement",
    "Element",
] }
image = { workspace = true, features = ["png"] }
gloo-timers = { workspace = true, features = ["futures"] }
console_error_panic_hook = "0.1"
log = { workspace = true }
