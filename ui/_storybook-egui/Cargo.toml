[package]
name = "storybook-egui"
version = "0.1.0"
edition.workspace = true
publish = false
# DEV ONLY — egui widgets storybook
# Run with: cd ui/_storybook-egui && trunk serve

[lib]
crate-type = ["cdylib"]

# The app and stories are wasm-only; a native build cannot reach these, so
# keep them under the target they actually compile for.
[target.'cfg(target_arch = "wasm32")'.dependencies]
egui = { workspace = true }
image = { workspace = true, features = ["png"] }
eframe = { workspace = true }
egui_extras = { workspace = true }
authorizations = { path = "../../authorizations" }
egui-widgets = { path = "../egui-widgets", features = ["image-editor", "gateway", "chain"] }
# The chain stories simulate a feed and fold it into a real `Heartbeat`.
chain-heartbeat = { path = "../../chain/chain-heartbeat", default-features = false }
# The vocabulary the wiring-editor story builds its fixtures from.
gateway-wiring = { path = "../../services/gateway-wiring" }
image-core = { path = "../image-core" }
# The perf_strip story drives a real gauge rather than a fixture.
perf-probe = { path = "../../perf-probe" }
cardano-assets = { workspace = true }
cardano-tx = { path = "../../cardano-tx" }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true, features = [
    "Window",
    "Document",
    "HtmlCanvasElement",
    "Element",
    # The `html_stage` story counts iframes in the live document — its own
    # instrument for the teardown trap (a stage left mounted is an animation
    # loop left running).
    "NodeList",
] }
# The `html_stage` story parses a real CIP-25 fixture through
# `cardano_assets::AssetEnvelope`, so the story exercises the extraction half
# of the live-art path rather than only the mounting half.
serde_json = { workspace = true }
gloo-timers = { workspace = true, features = ["futures"] }
console_error_panic_hook = "0.1"
log = { workspace = true }

# The native test targets (`canvas_copy` and `registry`) use these directly.
[dev-dependencies]
egui = { workspace = true }
image = { workspace = true, features = ["png"] }
