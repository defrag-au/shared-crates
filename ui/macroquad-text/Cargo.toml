[package]
name = "macroquad-text"
version = "0.1.0"
edition.workspace = true
publish = false
description = "Text for every macroquad surface: exact-size, DPI-correct runs, rich text layout, the glyph gate that keeps a font atlas to one upload a frame, and the capture report's record of every line drawn"

# Below both `macroquad-widgets` and `macroquad-gamekit`, so a widget's label
# and a game's card text draw the same way, are gated the same way, and show up
# in the same capture report. Macroquad only — no wasm-bindgen anywhere in the
# tree, since miniquad's gl.js cannot host it. Compiles native + wasm32.

[dependencies]
macroquad = "0.4"
